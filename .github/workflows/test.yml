name: Replay keyboard journeys
on: [push, pull_request]
permissions:
  contents: read
jobs:
  keyboard:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox]
    env:
      FOCUS_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test
      - run: npm run demo
