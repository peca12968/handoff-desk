name: Verify overlap-hours system
'on':
- push
- pull_request
permissions:
  contents: read
jobs:
  api:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: dotnet build src -c Release
    - run: python -m unittest -v
  slot-calendar-calendar:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - run: dotnet build ../../src -c Release
    - run: npm ci
    - run: npm test
    defaults:
      run:
        working-directory: modules/slot-calendar
