<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d37">
  <title>交班簿 · Handoff Desk</title>
  <link rel="stylesheet" href="/desk.css">
</head>
<body>
  <header><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>交班簿 <span lang="en">Handoff Desk</span></div></header>
  <main>
    <div class="topline"><h1>交班紀錄</h1><a id="shared" hidden target="_blank" rel="noopener">在新分頁開啟</a></div>
    <div class="layout">
      <section class="sheet" aria-labelledby="editor-title">
        <div class="sheet-head"><h2 id="editor-title"><label for="draft">交班內容</label></h2><span id="version">新紀錄</span></div>
        <textarea id="draft" rows="10" placeholder="記下已完成的事、待處理事項與接班提醒…" disabled></textarea>
        <div class="sheet-foot"><span id="count">0 / 16,384 位元組</span><button id="save" disabled>建立紀錄</button></div>
      </section>
      <aside aria-labelledby="state-heading"><h2 id="state-heading">紀錄狀態</h2><p id="status" role="status" aria-live="polite">準備中…</p><p id="guide">首次儲存後，可在新分頁開啟同一份紀錄。</p><button id="retry" hidden>重新讀取</button></aside>
    </div>
    <section id="conflict" hidden aria-labelledby="comparison">
      <h2 id="comparison" tabindex="-1">版本對照</h2>
      <p>請參考兩版內容，在上方編輯區整合需要保留的文字，再儲存合併結果。</p>
      <div class="columns"><section><h3 id="base-label"></h3><pre id="base-text"></pre></section><section><h3 id="latest-label"></h3><pre id="latest-text"></pre></section></div>
      <button id="resume">返回草稿編輯</button>
    </section>
  </main>
  <script type="module" src="/desk.js"></script>
</body>
</html>
