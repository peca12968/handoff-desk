<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件封存</title>
<style>
  :root { font: 1rem/1.6 "Source Sans 3", system-ui, sans-serif; color: #1a3039; background: #f4f6f4; }
  main { margin: 10vh auto; width: min(34rem, 90%); }
  h1, h2 { line-height: 1.25; }
  ul { list-style: none; padding: 0; border-top: 2px solid #284b51; }
  li { display: flex; align-items: center; justify-content: space-between; padding: 1rem 0; border-bottom: 1px solid #b2c0c1; }
  button { font: inherit; padding: .35rem .9rem; background: white; color: inherit; border: 1px solid #5a7477; border-radius: .3rem; }
  :focus-visible { outline: 3px solid #165ec1; outline-offset: 3px; }
  dialog { color: inherit; border: 1px solid #5a7477; border-radius: .5rem; padding: 1.6rem; }
  dialog::backdrop { background: #12292e66; }
</style>
<main>
  <h1 id="queue" tabindex="-1">待封存文件</h1>
  <ul>
    <li><span>盤點清單</span><button id="stock" aria-label="封存 盤點清單">封存</button></li>
    <li><span>到貨紀錄</span><button id="deliveries" aria-label="封存 到貨紀錄">封存</button></li>
  </ul>
  <p id="status" role="status"></p>
</main>
<dialog aria-labelledby="question">
  <h2 id="question"></h2>
  <button id="cancel" autofocus>取消</button>
  <button id="confirm">確認封存</button>
</dialog>
<script>
  const dialog = document.querySelector("dialog");
  const list = document.querySelector("ul");
  const cancel = document.getElementById("cancel");
  const confirm = document.getElementById("confirm");
  let row;
  list.addEventListener("click", event => {
    if (!event.target.matches("button")) return;
    row = event.target.closest("li");
    document.getElementById("question").textContent = "封存「" + row.firstElementChild.textContent + "」？";
    dialog.showModal();
  });
  cancel.onclick = () => dialog.close();
  dialog.onkeydown = event => {
    if (event.key !== "Tab") return;
    if (event.shiftKey && document.activeElement === cancel) {
      event.preventDefault();
      confirm.focus();
    } else if (!event.shiftKey && document.activeElement === confirm) {
      event.preventDefault();
      cancel.focus();
    }
  };
  confirm.onclick = () => {
    const successor = (row.nextElementSibling || row.previousElementSibling)?.querySelector("button");
    dialog.close();
    row.remove();
    document.getElementById("status").textContent = list.children.length ? "已封存文件。" : "所有文件已封存。";
    if (location.hash !== "#regression") (successor || document.getElementById("queue")).focus();
  };
</script>
</html>
